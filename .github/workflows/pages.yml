name: Web-версия на GitHub Pages

# Публикует демо-версию (работает в браузере без сервера) по адресу
# https://<владелец>.github.io/coachpilot/ при каждом пуше в main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: >
          flutter build web --release --no-web-resources-cdn
          --base-href /${{ github.event.repository.name }}/
          --dart-define=DEMO_ONLY=true
          --dart-define=DEMO_SAMPLE=true
          --dart-define=BUILD="$(TZ=Europe/Moscow date '+%d.%m %H:%M')"
          --dart-define=API_URL=${{ vars.API_URL || 'https://api.invalid' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
