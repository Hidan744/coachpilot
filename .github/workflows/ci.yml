name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coachpilot
          POSTGRES_PASSWORD: coachpilot
          POSTGRES_DB: coachpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coachpilot" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CP_DATABASE_URL: postgresql+asyncpg://coachpilot:coachpilot@localhost:5432/coachpilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  android:
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://api.example.ru' }}
      - uses: actions/upload-artifact@v4
        with:
          name: coachpilot-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build ios --release --no-codesign --dart-define=API_URL=${{ vars.API_URL || 'https://api.example.ru' }}

  e2e:
    needs: [backend, app]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coachpilot
          POSTGRES_PASSWORD: coachpilot
          POSTGRES_DB: coachpilot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coachpilot" --health-interval 5s --health-retries 10
    env:
      CP_DATABASE_URL: postgresql+asyncpg://coachpilot:coachpilot@localhost:5432/coachpilot
      # Все сценарии регистрируют пользователей с одного адреса.
      CP_REGISTER_LIMIT_PER_HOUR: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Backend
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.catalog.seed
          nohup uvicorn app.main:app --port 8000 > /tmp/api.log 2>&1 &
      - name: Web build
        working-directory: app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release --no-web-resources-cdn --dart-define=API_URL=http://localhost:8000
          nohup python3 -m http.server 8080 -d build/web > /tmp/web.log 2>&1 &
      - name: Sync integration tests (two devices against real API)
        working-directory: app
        run: CP_API_URL=http://localhost:8000 flutter test test/sync_engine_test.dart
      - name: Browser scenarios
        working-directory: e2e
        env:
          SHOTS: /tmp/shots
          CHROME: ""
        run: |
          mkdir -p /tmp/shots
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
          python3 make_fixtures.py /tmp/sostav.docx
          for f in smoke_stage2 smoke_stage3 smoke_stage4 smoke_stage5 smoke_stage6_7 smoke_features2 smoke_season smoke_performance; do DOCX=/tmp/sostav.docx node $f.mjs; done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/shots
