name: coachpilot
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^3.6.1
  connectivity_plus: ^7.3.2
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.0
  http: ^1.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  pdf: ^3.12.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  wakelock_plus: ^1.8.1
  web: ^1.1.1
  xml: ^6.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
  fonts:
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Oswald_700Bold.ttf
          weight: 700
