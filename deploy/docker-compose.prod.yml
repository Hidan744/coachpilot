# Продакшен: API + PostgreSQL + Caddy (автоматический HTTPS) + ежедневные бэкапы.
# Запуск на сервере:  cd deploy && cp .env.prod.example .env && nano .env && docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: coachpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задайте DB_PASSWORD}
      POSTGRES_DB: coachpilot
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coachpilot"]
      interval: 5s
      retries: 20

  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env
    environment:
      CP_ENV: prod
      CP_DATABASE_URL: postgresql+asyncpg://coachpilot:${DB_PASSWORD}@db:5432/coachpilot
    depends_on:
      db: {condition: service_healthy}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api]

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGPASSWORD: ${DB_PASSWORD}
    volumes: [./backups:/backups]
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U coachpilot -Fc coachpilot > /backups/coachpilot-$$(date +%F).dump &&
        find /backups -name "*.dump" -mtime +14 -delete;
        sleep 86400; done'
    depends_on:
      db: {condition: service_healthy}

volumes:
  pgdata:
  caddy_data:
